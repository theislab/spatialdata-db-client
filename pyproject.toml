[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "hatch-vcs" ]

[project]
name = "spatialdata-db"
description = "Lean read client for the spatialdata-db spatial-omics collection."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "spatialdata",
  "pandas>=2.2",
  "pyarrow",
  "fsspec",
  "s3fs",
  "rapidfuzz",
  "zarr>=3",
  "platformdirs",
  "universal-pathlib",
  "typer",
]

[project.optional-dependencies]
viz = [ "vitessce", "easy_vitessce", "spatialdata-plot", "anndata<0.13" ]
mcp = [ "mcp" ]
llm = [ ]
loader = [
  "pydantic>=2",
  "squidpy>=1.8.2",
  "dask-image",
  "scikit-image",
  # spatialbatch is not on PyPI; CI installs it from git first (test.yaml, job loader). Pin it here once it is released.
  "spatialbatch",
  "snakemake>=9",
  "snakemake-executor-plugin-slurm",
  "threadpoolctl",
]

[project.scripts]
sddb-cli = "sddb.cli:app"
sddb-mcp = "sddb.mcp.server:main"

[dependency-groups]
test = [ "pytest", "coverage", "pytest-cov", "sphinx>=8.1" ]  # tests/test_docs_stats.py loads docs/_ext
typecheck = [ "mypy", "pandas-stubs" ]
doc = [ "scverse-doc[full]>=0.3,<0.4", "ipykernel", "ipywidgets", "nbconvert" ]

[tool.uv.sources]
# spatialbatch is not on PyPI: uv (docs job, readthedocs) resolves it from git, at the commit the loader job installs
# (test.yaml). pip ignores this table.
spatialbatch = { git = "https://github.com/timtreis/spatialbatch", rev = "cb23d0630ee5ce4f7411545a13326bfa9f0b5cac" }

[tool.uv]
# spatialbatch's own tool.uv.sources points annbatch at a sibling checkout (../annbatch), which uv follows for a git
# dependency; take annbatch from PyPI instead.
override-dependencies = [ "annbatch>=0.3.1" ]

[tool.hatch.version]
source = "vcs"
# Only v<semver> tags set the version; catalog-YYYY-MM-DD release tags are ignored.
raw-options = { tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+.*)$", git_describe_command = "git describe --dirty --tags --long --match 'v*'" }

[tool.hatch.build.targets.wheel]
packages = [ "src/sddb" ]

[tool.hatch.build.targets.sdist]
exclude = [ "/docs", "/tests" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
extend-exclude = [ "docs/design" ]
format.docstring-code-format = true
lint.select = [ "B","C4","D","E","F","I","NPY","PT","RET","RUF100","TID","UP","W" ]
lint.ignore = [ "B008","D100","D104","D105","D107","D203","D213","D400","D401","E501","E731","E741" ]
lint.per-file-ignores."docs/**/*.ipynb" = [ "D" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [ "anndata.*", "mcp.*","fsspec.*", "pyarrow.*", "spatialdata.*", "upath.*" ]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [ "--import-mode=importlib", "-m", "not network and not slow" ]
pythonpath = [ "." ]
testpaths = [ "tests" ]
markers = [
  "network: tests that require network/S3 access (deselected by default)",
  "slow: large synthetic-data tests (deselected by default; run with -m slow)",
]

[tool.coverage.run]
source = [ "sddb" ]
omit = [ "**/test_*.py" ]
