# GPU environment for the Atera primer: linux-64, NVIDIA GPU, CUDA 13 driver (>= 580).
# Same stack as docs/use_cases/visium_atlas (RAPIDS 26.10 + rapids-singlecell-cu13), plus spatialdata-plot for the
# spatial figures and nbconvert to execute the notebook.
# Follows rapids-singlecell's recommended conda env (conda/rsc_rapids_26.10_cuda13.yml): RAPIDS 26.10 from
# conda plus the prebuilt rapids-singlecell-cu13 wheel, so nothing is compiled.
# Run on a GPU node from this directory: `pixi run execute` (or `pixi run jupyter lab`)
[workspace]
name = "sddb-atera-primer"
channels = ["rapidsai", "nvidia", "conda-forge"]
platforms = ["linux-64"]
# RAPIDS supports flexible priority; strict hides conda-forge's numba-cuda behind rapidsai's py3.10-only builds
channel-priority = "disabled"

[system-requirements]
cuda = "13"

[dependencies]
python = "3.14.*"
cuda-version = "13.3.*"
# the RAPIDS libraries rapids-singlecell uses (the `rapids` metapackage's channel-pinned xgboost/ucx don't solve in pixi)
cudf = "26.10.*"
cuml = "26.10.*"
cugraph = "26.10.*"
cuvs = "26.10.*"
rmm = "26.10.*"
cupy = "*"
scanpy = "*"
jupyterlab = "*"
nbconvert = "*"
ipykernel = "*"
jupytext = "*"
pyarrow = "*"
# the client's I/O stack, solved by conda together with RAPIDS (pip would backtrack s3fs against conda's fsspec)
spatialdata = "*"
s3fs = "*"
zarr = ">=3"
rapidfuzz = "*"
platformdirs = "*"
universal_pathlib = "*"
typer = "*"

[pypi-dependencies]
rapids-singlecell-cu13 = "*"
spatialdata-plot = "*"
spatialdata-db = { git = "https://github.com/theislab/spatialdata-db-client.git", tag = "v0.1.4" }  # the pinned client release

[activation.env]
PYTHONNOUSERSITE = "1"  # keep ~/.local pip installs (e.g. stray nvidia-* wheels) from shadowing the env's CUDA libs

[tasks]
execute = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=14400 primer.ipynb"
