      oligodendrocyte: [MBP, PLP1, MOG]
      opc: [PDGFRA]  # not CSPG4, which pericytes share; OLIG2 and SOX10 are shared with oligodendrocytes
      microglia: [CX3CR1, P2RY12, TMEM119]
      endothelial: [CLDN5, FLT1, PECAM1]
    fallback:
      Xenium-347-cce0810f:
