        opc: {genes: [Vcan, Sox10], note: "OPC genes on this panel; SOX10 is also in oligodendrocytes"}
        microglia: {genes: [Sall1], note: "the only microglia-specific gene on this panel"}
      Merscope-500-5085e6ca:
        neuron: {genes: [Slc17a7, Slc17a6, Gad2, Slc32a1], note: "no pan-neuronal gene on this panel; excitatory plus inhibitory markers cover neurons"}
        opc: {genes: [Vcan, Sox10], note: "OPC genes on this panel; SOX10 is also in oligodendrocytes"}
        microglia: {not_measured: true, note: "no microglia gene on this panel"}
