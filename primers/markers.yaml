      Xenium-348-3974002b:
        neuron: {genes: [Slc17a7, Slc17a6, Gad1, Gad2], note: "no pan-neuronal gene on this panel; excitatory plus inhibitory markers cover neurons"}
      Xenium-347-696b1080:
        neuron: {genes: [Slc17a7, Slc17a6, Gad1, Gad2], note: "no pan-neuronal gene on this panel; excitatory plus inhibitory markers cover neurons"}
      MERFISH-1122-5c75344a:
