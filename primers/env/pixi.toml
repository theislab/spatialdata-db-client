# GPU environment for primer runs on the HPC (Task 2). It is the T094 mixing-spike environment, which ran
# on a B300 (job 42379114), plus spatialdata-plot. The primers package is put on PYTHONPATH by
# ../hpc/common.sh rather than installed, because its uv source would build the client from the checkout
# instead of the pinned tag. Install on a node with
# CONDA_OVERRIDE_CUDA=13.3 set; see ../README.md.
[workspace]
name = "sddb-primers"
channels = ["rapidsai", "nvidia", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "disabled"

[system-requirements]
cuda = "13"

[dependencies]
python = "3.14.*"
cuda-version = "13.3.*"
cudf = "26.10.*"
cuml = "26.10.*"
cugraph = "26.10.*"
cuvs = "26.10.*"
rmm = "26.10.*"
cupy = "*"
scanpy = "*"
spatialdata = "*"
spatialdata-plot = "*"
jupyterlab = "*"
papermill = "*"
nbconvert = "*"
pyyaml = "*"
s3fs = "*"
zarr = ">=3"
rapidfuzz = "*"
platformdirs = "*"
universal_pathlib = "*"
typer = "*"

[pypi-dependencies]
rapids-singlecell-cu13 = "*"
spatialdata-db = { git = "https://github.com/theislab/spatialdata-db-client", tag = "v0.1.3" }

[activation.env]
PYTHONNOUSERSITE = "1"  # keep ~/.local pip installs (e.g. stray nvidia-* wheels) from shadowing the env's CUDA libs
