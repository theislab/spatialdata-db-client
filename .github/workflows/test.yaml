name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  MPLBACKEND: agg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install
        run: pip install -e . --group test
      - name: Test
        run: pytest -m "not network" --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true

  primers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Test (CPU)
        run: uv run --directory primers --group test pytest tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --group doc
      - name: Build docs
        run: uv run --group doc sphinx-build -W --keep-going -b html docs docs/_build/html

  check:
    if: always()
    needs: [test, primers, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
