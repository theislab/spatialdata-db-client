name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  MPLBACKEND: agg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install
        run: pip install -e . --group test
      - name: Test
        run: pytest -m "not network" --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true

  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install spatialbatch
        # rushin682/spatialbatch#3 (obsm centres, crop at read time); move to rushin682/spatialbatch once merged
        run: pip install "spatialbatch @ git+https://github.com/timtreis/spatialbatch@cb23d0630ee5ce4f7411545a13326bfa9f0b5cac"
      - name: Install
        run: pip install -e ".[loader]" --group test
      - name: Test
        run: pytest -m "not network" tests/test_contract.py tests/test_loader_adapters.py tests/test_loader_materialize.py tests/test_loader_snakemake.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --group doc
      - name: Build docs
        run: uv run --group doc sphinx-build -W --keep-going -b html docs docs/_build/html

  check:
    if: always()
    needs: [test, loader, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
